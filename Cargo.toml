[package]
name = "tree-sitter-mirth"
description = "Mirth is a strongly-typed concatenative programming language"
version = "0.1.0"
authors = ["amatgil <amatgilvinyes@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mirth"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/typeswitch/mirth"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
